.<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta name="theme-color" content="#000000">

  <title>Key Generated | FOX VPN</title>

  <style>
    :root {
      --bg: #000000;
      --card: #121212;
      --text: #ffffff;
      --muted: #888888;
      --border: #222222;
      --accent: #00ff88;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;

      display: flex;
      justify-content: center;
      align-items: center;

      background: var(--bg);
      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    .container {
      width: 100%;
      max-width: 450px;
      text-align: center;
    }

    /* Logo */
    .key-icon {
      width: 85px;
      height: 85px;

      margin: 0 auto 18px;

      display: flex;
      justify-content: center;
      align-items: center;

      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 50%;

      overflow: hidden;

      box-shadow:
        0 0 25px rgba(0, 255, 136, 0.1);
    }

    .key-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Heading */
    h1 {
      margin: 0 0 8px;

      font-size: 28px;
      font-weight: 700;
    }

    .subtitle {
      margin: 0 0 30px;

      color: var(--muted);
      font-size: 14px;
    }

    /* Card */
    .card {
      padding: 35px 30px 30px;

      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 28px;

      text-align: center;

      box-shadow:
        0 15px 50px rgba(0, 0, 0, 0.6);
    }

    h2 {
      margin: 0 0 12px;

      color: var(--accent);

      font-size: 22px;
      font-weight: 700;
    }

    .card-p {
      margin: 0 0 25px;

      color: #999;

      font-size: 14px;
      line-height: 1.6;
    }

    /* Key Box */
    .key-box {
      margin-bottom: 25px;
      padding: 22px;

      background: #000;

      border: 1px dashed var(--accent);
      border-radius: 18px;

      overflow: hidden;
    }

    #finalKey {
      color: var(--accent);

      font-family: "Courier New", monospace;

      font-size: 19px;
      font-weight: bold;

      letter-spacing: 1px;

      word-break: break-all;
    }

    /* Copy Button */
    .btn {
      width: 100%;
      padding: 18px;

      border: none;
      border-radius: 16px;

      background: #ffffff;
      color: #000000;

      font-size: 16px;
      font-weight: 800;

      cursor: pointer;

      transition:
        transform 0.25s ease,
        background 0.25s ease,
        box-shadow 0.25s ease;
    }

    .btn:hover {
      transform: scale(1.03);

      background: var(--accent);

      box-shadow:
        0 10px 20px rgba(0, 255, 136, 0.2);
    }

    .btn:active {
      transform: scale(0.98);
    }

    /* Footer */
    .footer {
      margin-top: 50px;

      color: #333;

      font-size: 10px;
      font-weight: bold;

      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* Mobile */
    @media (max-width: 480px) {

      body {
        padding: 15px;
      }

      .key-icon {
        width: 75px;
        height: 75px;
      }

      h1 {
        font-size: 25px;
      }

      .card {
        padding: 30px 20px;
        border-radius: 22px;
      }

      #finalKey {
        font-size: 17px;
      }
    }

    /* Desktop */
    @media (min-width: 768px) {

      .key-icon {
        width: 110px;
        height: 110px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <!-- Logo -->
    <div class="key-icon">
      <img
        src="./assets/logo.png"
        alt="FOX VPN Logo"
      >
    </div>

    <h1>Access Unlocked</h1>

    <p class="subtitle">
      Your device-locked license key is ready.
    </p>

    <!-- Key Card -->
    <div class="card">

      <h2>Generation Success!</h2>

      <p class="card-p">
        Your unique key has been generated
        for this device.
      </p>

      <div class="key-box">
        <span id="finalKey">
          GENERATING KEY...
        </span>
      </div>

      <button
        class="btn"
        id="copyBtn"
        type="button"
        onclick="copyKey()"
      >
        COPY TO CLIPBOARD
      </button>

    </div>

    <div class="footer">
      FOX VPN SECURITY SYSTEM
    </div>

  </main>


  <script>

    /* =========================================
       GENERATE KEY
    ========================================== */

    async function generateLockedKey() {

      const keyElement =
        document.getElementById("finalKey");

      try {

        /*
          Get public IP
        */

        const response =
          await fetch(
            "https://api.ipify.org?format=json"
          );

        if (!response.ok) {
          throw new Error("IP request failed");
        }

        const data =
          await response.json();

        const ip =
          data.ip;


        /*
          Current day
        */

        const day =
          Math.floor(
            Date.now() / 86400000
          );


        /*
          Create IP seed
        */

        const ipSeed =
          parseInt(
            ip
              .replace(/\./g, "")
              .substring(0, 6)
          );


        /*
          Same seed formula
        */

        let seed =
          ipSeed + day + 2026;


        /*
          Deterministic random
        */

        function rnd() {

          const x =
            Math.sin(seed++) * 10000;

          return Math.abs(
            x - Math.floor(x)
          );
        }


        /*
          Key characters
        */

        const chars =
          "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";


        const segments = [];


        /*
          Generate:
          XXXX-XXXX-XXXX-XXXX
        */

        for (let i = 0; i < 4; i++) {

          let segment = "";

          for (let j = 0; j < 4; j++) {

            const index =
              Math.floor(
                rnd() * chars.length
              );

            segment +=
              chars.charAt(index);
          }

          segments.push(segment);
        }


        /*
          Final key
        */

        const finalKey =
          "FOXVPN-" +
          segments.join("-");


        keyElement.innerText =
          finalKey;

      } catch (error) {

        console.error(error);

        keyElement.innerText =
          "CONNECT TO INTERNET";
      }
    }


    /* =========================================
       COPY KEY
    ========================================== */

    async function copyKey() {

      const key =
        document.getElementById(
          "finalKey"
        ).innerText;


      if (
        key.includes("GENERATING") ||
        key.includes("CONNECT")
      ) {
        return;
      }


      try {

        await navigator.clipboard.writeText(key);


        const button =
          document.getElementById(
            "copyBtn"
          );


        button.innerText =
          "COPIED SUCCESSFULLY! ✅";

        button.style.background =
          "#00ff88";


        setTimeout(() => {

          button.innerText =
            "COPY TO CLIPBOARD";

          button.style.background =
            "#ffffff";

        }, 2000);

      } catch (error) {

        console.error(
          "Copy failed:",
          error
        );

      }
    }


    /* =========================================
       START
    ========================================== */

    window.addEventListener(
      "load",
      generateLockedKey
    );

  </script>

</body>

</html>
